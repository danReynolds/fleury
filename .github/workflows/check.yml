name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          # Pinned, not `stable`: the embedded serve-client asset is a dart2js
          # build checked for freshness by recompiling and comparing, so a
          # floating SDK silently re-breaks that test on every release. Bump
          # deliberately and regenerate the asset in the same commit:
          #   dart tool/fleury_dev.dart build-remote-client
          sdk: 3.12.2
      - name: Bootstrap (pub get across packages)
        run: dart tool/fleury_dev.dart bootstrap
      - name: Check (analyze + test + dart2js smoke, all packages)
        run: dart tool/fleury_dev.dart check
      - name: Hot reload VM-service gate
        working-directory: packages/fleury
        run: dart run tool/hot_reload_probe/driver.dart
      # The fast perf-gate suite: deterministic counters + structural
      # invariants (serve-semantics, image-bench, bundle-size, alloc-gate,
      # input-alloc-gate, paint-gate, selection-gate, runtime-gate; ~24s).
      # paint-gate's, selection-gate's and runtime-gate's gated axes are exact
      # counters (machine-independent); alloc-gate is SDK-sensitive but the SDK above
      # is pinned — on a deliberate SDK bump, re-baseline in the bump commit
      # (never loosen a tolerance). Heavier PTY gates (wire-gate,
      # serve-wire-live) stay on-demand; see
      # docs/implementation/perf-gates.md.
      - name: Repaint-cache staleness check (fleury suite)
        # Re-runs the core suite with every repaint-boundary cache HIT verified
        # against a fresh repaint of the subtree. A boundary is the one place
        # where an under-reported change is unrecoverable: frame damage is
        # derived by comparing buffers, so it cannot see a stale blit — by then
        # the buffer genuinely matches. Measured overhead on this suite is
        # within run-to-run noise, because few tests reach a cache hit.
        working-directory: packages/fleury
        env:
          FLEURY_VERIFY_REPAINT_CACHE: '1'
        run: dart test -x integration
      - name: Perf gates (fast suite)
        run: dart tool/fleury_dev.dart benchmark gates
      - name: Scenario benchmark oracles
        run: dart tool/fleury_dev.dart benchmark scenario-gate

  inline-terminal:
    name: inline terminal (${{ matrix.os }}, Dart ${{ matrix.sdk }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        sdk: ["3.12.2"]
        include:
          - os: ubuntu-latest
            sdk: "3.10.4"
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve the native fixture and terminal emulator
        run: |
          cd packages/fleury
          dart pub get
          cd ../..
          python -m pip install -r tool/inline-pty-requirements.txt
      - name: Exercise native acquisition and restoration failures
        working-directory: packages/fleury
        run: >-
          dart test
          test/terminal/posix_input_lease_test.dart
          test/terminal/native_termios_ownership_test.dart
          test/terminal/posix_driver_lifecycle_test.dart
          test/runtime/inline_terminal_lease_test.dart
      - name: Exercise inline rendering and lifecycle over a PTY
        run: python tool/check_inline_tui.py
      - name: Exercise sequential native sessions
        run: |
          python tool/check_native_input.py
          python tool/check_sequential_sessions.py
          dart compile exe packages/fleury/test/fixtures/sequential_native_sessions_fixture.dart --packages=packages/fleury/.dart_tool/package_config.json -o "${{ runner.temp }}/fleury-sequential"
          python tool/check_sequential_sessions.py --executable "${{ runner.temp }}/fleury-sequential"

  create-smoke:
    name: create smoke (${{ matrix.os }}, Dart ${{ matrix.sdk }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        sdk: ["3.12.2"]
        include:
          - os: ubuntu-latest
            sdk: "3.10.4"
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - name: Resolve CLI test dependencies
        working-directory: packages/fleury
        run: dart pub get
      - name: Generate, analyze, test, and compile a fresh project
        working-directory: packages/fleury
        run: >-
          dart test
          test/cli/create_command_test.dart
          test/integration/create_project_test.dart
          --concurrency=1
          -x pty
