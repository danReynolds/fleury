name: docs

on:
  push:
    branches: [main]
  # Build (not deploy) on PRs as well. The docs build has its own failure modes
  # that `fleury_dev check` does not cover — page generation asserts every
  # examples-registry entry resolves to a documented Dart API, so a new example
  # can break the site while every test and gate stays green. Running only on
  # push to main meant that surfaced *after* merge, with main's docs left
  # broken until someone noticed.
  pull_request:
  # Deploys main again, such as after a Pad compiler release (see "Check the
  # live Pad compiler" below): Actions > docs > Run workflow on main, or
  # `gh workflow run docs --ref main`. The github-pages environment deploys
  # only from main.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per-ref so PR builds don't serialize behind each other or behind a deploy.
  group: pages-${{ github.ref }}
  # Never cancel a deploy mid-flight; superseded PR builds are fine to drop.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # A PR's merge commit and its base, which the compiler check diffs.
          fetch-depth: 2
      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - name: Resolve Dart documentation examples
        working-directory: website/examples
        run: dart pub get
      - name: Generate the docs' Pad projects
        working-directory: website/examples
        run: dart run bin/guide_projects.dart
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      # The docs deploy on every push to main, but the Pad compiler behind their
      # Run buttons is released by hand. When the docs need a library or API the
      # serving compiler predates, every editable demo's Run fails to compile
      # (after #291, for over an hour). So before building, compile a sample of
      # the docs' projects on the live compiler, as a reader's Run sends them.
      #
      # On main, Run is enabled only if they compile. Otherwise this deploy
      # still ships, with the compiler URL left empty: Pads are read-only beside
      # their prebuilt demos, and the run carries an error annotation and a job
      # summary naming each failing project. To restore Run, release the Pad
      # compiler from that commit (experiments/fleury_pad/DEPLOYMENT.md), then
      # re-run this workflow ("Re-run all jobs", or workflow_dispatch on main).
      #
      # On a pull request it only warns that the PR needs a compiler release
      # after it merges; its build is unchanged. A PR that changes nothing the
      # docs send the compiler skips the check: each one wakes the
      # scale-to-zero compiler, which bills for its idle minutes afterward.
      #
      # The step never fails the job. If it errors, its output is empty, and a
      # deploy is read-only rather than unchecked.
      - name: Check the live Pad compiler
        id: pad
        continue-on-error: true
        timeout-minutes: 8
        env:
          COMPILER_URL: ${{ vars.FLEURY_PAD_COMPILER_URL }}
          EVENT: ${{ github.event_name }}
        run: |
          mode=deploy
          if [ "$EVENT" = pull_request ]; then
            mode=pull-request
            # HEAD^1 is the PR's base: the first parent of GitHub's merge commit.
            if git diff --quiet HEAD^1 HEAD -- website/examples packages/samples \
                experiments/fleury_pad/lib experiments/fleury_pad/dartpad/web \
                website/src/components/pad website/scripts/pad-compiler-guard.mjs \
                .github/workflows/pages.yml; then
              echo "This PR doesn't change what the docs send the Pad compiler; not checking it."
              exit 0
            fi
          fi
          node website/scripts/pad-compiler-guard.mjs --mode "$mode" --compiler "$COMPILER_URL"
      - name: Build GitHub Pages artifact
        env:
          # A PR builds with the configured compiler whatever the check found;
          # a deploy uses only the compiler the check verified.
          PUBLIC_FLEURY_PAD_COMPILER_URL: ${{ github.event_name == 'pull_request' && vars.FLEURY_PAD_COMPILER_URL || steps.pad.outputs.compiler-url }}
        uses: withastro/action@v6
        with:
          path: website
          node-version: 24
          package-manager: npm

  deploy:
    needs: build
    # Publish only from main. A PR build proves the site compiles; it must not
    # replace what is live.
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
