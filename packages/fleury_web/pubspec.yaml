name: fleury_web
description: >-
  Run fleury in a browser through the retained DOM host.
version: 0.1.0
repository: https://github.com/danReynolds/fleury/tree/main/packages/fleury_web
issue_tracker: https://github.com/danReynolds/fleury/issues
topics:
  - tui
  - terminal
  - web

environment:
  sdk: ^3.10.4

dependencies:
  # The browser host consumes Fleury's explicitly lockstep remote wire.
  # Keep this exact; pubspec_overrides.yaml resolves the monorepo sibling
  # during development.
  fleury: 0.1.0
  web: ^1.1.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.3
