name: fleury_mcp
description: >-
  A Model Context Protocol server that drives a Fleury terminal-UI app through
  its semantic tree, so any MCP host can read and operate it.
version: 0.1.1
repository: https://github.com/danReynolds/fleury/tree/main/packages/fleury_mcp
issue_tracker: https://github.com/danReynolds/fleury/issues
topics:
  - mcp
  - agents
  - tui
  - terminal
  - automation

executables:
  fleury_mcp: fleury_mcp

# The server reaches its app over a Unix-domain socket and spawns the app as a
# child process, so it runs on macOS and Linux only.
platforms:
  linux:
  macos:

environment:
  sdk: ^3.10.4

dependencies:
  # Uses Fleury's supported host/process SPI and its explicitly unstable
  # first-party wire. Keep this exact-pinned so the executable and driven app
  # resolve the matching Fleury build; INIT rejects any wire-version skew.
  # pubspec_overrides.yaml resolves the sibling package during monorepo
  # development; pub ignores that file when publishing.
  fleury: 0.1.1
  # Grapheme-cluster counting for press_key, matching how fleury core treats
  # user-typed text (input_dispatcher / text_editing).
  characters: ^1.4.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.3
